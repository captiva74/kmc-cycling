<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe oublié - CycloStats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-centree">
    <div class="card carte-etroite">
        <h1>🔑 Récupération</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ 'succes' if category == 'succes' else 'erreur' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="email">Adresse e-mail de récupération</label>
            <input type="email" id="email" name="email" required placeholder="Entrez votre e-mail">

            <button type="submit" class="pleine-largeur" style="margin-top: 20px;">Envoyer le lien</button>
        </form>
        
        <div class="lien" style="margin-top: 15px; text-align: center;">
            <a href="{{ url_for('login') }}">Retour à la connexion</a>
        </div>
    </div>
</body>
</html>
