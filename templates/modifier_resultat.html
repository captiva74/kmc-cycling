<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Modifier un résultat - Cyclisme</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="app-layout">
      {% include 'sidebar.html' %}
      <main class="content">
        <div class="container carte-formulaire">
          <div class="card">
            <h1>✏️ Modifier le résultat</h1>
            
            <form action="{{ url_for('modifier_resultat', id=resultat.id) }}" method="POST">
              
              <label for="athlete_id">Athlète</label>
              <select id="athlete_id" name="athlete_id" required>
                {% for a in athletes %}
                <option value="{{ a.id }}" {% if a.id == resultat.athlete_id %}selected{% endif %}>
                  {{ a.nom }} {{ a.prenom }} {% if a.categorie %}({{ a.categorie }}){% endif %}
                </option>
                {% endfor %}
              </select>

              <label for="course">Nom de la course</label>
              <input type="text" id="course" name="course" value="{{ resultat.nom_course }}" required />

              <label for="date_course">Date de la course</label>
              <input type="date" id="date_course" name="date_course" value="{{ resultat.date_course }}" required />

              <label for="classement">Classement</label>
              <input type="number" id="classement" name="classement" min="1" value="{{ resultat.classement }}" required />

              <div class="boutons">
                <a href="{{ url_for('historique') }}" class="lien-retour">Annuler</a>
                <button type="submit">Enregistrer les modifications</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
