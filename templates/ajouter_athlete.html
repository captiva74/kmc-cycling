<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un athlète - CycloStats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-layout">
        {% include 'sidebar.html' %}
        <main class="content">
            <div class="container carte-formulaire">
                <div class="card">
                    <h1>➕ Ajouter un athlète</h1>
                    <form method="POST" enctype="multipart/form-data">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" required>

                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom" required>

                        <label for="photo">Photo (optionnel)</label>
                        <input type="file" id="photo" name="photo" accept="image/*">

                        <label for="date_naissance">Date de naissance (optionnel)</label>
                        <input type="date" id="date_naissance" name="date_naissance">

                        <label for="categorie">Catégorie</label>
                        <select id="categorie" name="categorie">
                            <option value="">— Non renseignée —</option>
                            {% for cat in categories %}
                            <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>

                        <div class="boutons">
                            <a href="{{ url_for('liste_athletes') }}" class="lien-retour">Annuler</a>
                            <button type="submit">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
