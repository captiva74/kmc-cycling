<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouveau mot de passe - CycloStats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-centree">
    <div class="card carte-etroite">
        <h1>🔒 Nouveau mot de passe</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ 'succes' if category == 'succes' else 'erreur' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="new_password">Nouveau mot de passe</label>
            <input type="password" id="new_password" name="new_password" required>

            <button type="submit" class="pleine-largeur" style="margin-top: 20px;">Enregistrer</button>
        </form>
    </div>
</body>
</html>
